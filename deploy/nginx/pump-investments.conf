limit_req_zone $binary_remote_addr zone=pump_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pump_images:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pump_connections:10m;
proxy_cache_path /var/cache/nginx/pump-images levels=1:2 keys_zone=pump_images_cache:20m
  max_size=512m inactive=7d use_temp_path=off;

server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  server_name _;

  # cloudflared connects over loopback. Restore the actual browser address before
  # applying connection/rate limits so all public users are not treated as one client.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  client_max_body_size 64k;
  limit_conn_status 429;
  limit_req_status 429;
  limit_conn pump_connections 20;

  location /api/tokens/stream {
    limit_conn pump_connections 5;
    limit_req zone=pump_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
  }

  location /api/alerts/stream {
    limit_conn pump_connections 5;
    limit_req zone=pump_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
  }

  location /api/token-image/ {
    limit_req zone=pump_images burst=30 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache pump_images_cache;
    proxy_cache_lock on;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 5m;
    add_header X-Image-Cache $upstream_cache_status always;
  }

  location /api/chat {
    client_max_body_size 512k;
    limit_req zone=pump_api burst=5 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 5m;
    add_header X-Accel-Buffering no;
  }

  location /api/ {
    limit_req zone=pump_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
